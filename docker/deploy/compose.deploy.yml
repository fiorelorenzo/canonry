# Deployed-stack compose file for prodbox (issues #94, #95; SPEC.md #12). This
# is the deploy-time counterpart to docker/compose.yml: same three services
# (web, Postgres, Qdrant), but web references a pre-built, already-pushed
# image instead of `build:`, because the build happens once on a
# GitHub-hosted runner and this file only ever runs on the self-hosted runner
# that deploys it -- shipping the monorepo source, devDependencies and the
# pnpm store to prodbox just to rebuild there would defeat that split.
#
# One immutable copy of this file lives in every releases/<sha> directory
# (scripts/deploy/release.sh copies it in verbatim at deploy time), so a
# release's compose definition can never drift after the fact. Every
# invocation passes the same --project-name (canonry-<stack>) regardless of
# which release directory is current, so postgres and qdrant's named volumes
# persist across releases -- only web's image tag differs release to
# release, so `docker compose up -d` recreates web alone and leaves
# postgres/qdrant containers and data untouched. That one recreate is the
# other half of "rollback is a symlink flip plus a container recreate"
# (SPEC.md #12): flipping `current` to a different releases/<sha> and
# re-running this same command is the whole operation, forward or back.
#
# WEB_IMAGE, APP_VERSION and APP_COMMIT are written into each release's own
# .env by release.sh, never edited by hand. Everything else (POSTGRES_*,
# QDRANT ports, ORIGIN, the AI Gateway and Replicate credentials, Better Auth's
# secret, social provider credentials, STAFF_EMAILS) comes from the stack's
# shared secrets file (shared/secrets.env), managed on prodbox out of band and
# never generated or printed by any script here.
#
# MIGRATIONS ARE FORWARD-ONLY. `migrate` below runs once per `docker compose
# up`, from the same image `web` is about to serve, before `web` is created --
# so the schema a release expects and the schema on disk can never drift, and
# a broken migration fails loudly here (compose up itself fails, release.sh's
# health gate never even starts polling) instead of surfacing 90s later as an
# unexplained health-gate timeout. It is idempotent (drizzle tracks what it
# already applied in its own `drizzle.__drizzle_migrations` table), so a
# redeploy of the same or a later release is always safe to run again. But
# `scripts/deploy/rollback.sh` only flips `current` and recreates `web` -- it
# never touches `migrate`, so rolling back the code never rolls back a
# migration or the data it changed. A release whose migration should not have
# shipped needs a new forward migration, the same as any other Postgres
# deployment; a symlink flip cannot undo one.

# No top-level `name:` here on purpose: every invocation of this file MUST
# pass --project-name canonry-<stack> (scripts/deploy/lib.sh's compose_cmd
# does this always). Without it, prod and preview would default to the same
# project name and collide on the same box.

services:
  migrate:
    image: ${WEB_IMAGE}
    restart: 'no'
    command: ['node', 'migrate/dist/migrate.js']
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-5196}:5196'
    environment:
      PORT: '5196'
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_URL: ${QDRANT_URL}
      ORIGIN: ${ORIGIN}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      STAFF_EMAILS: ${STAFF_EMAILS}
      # Issue #247's password reset and #250's account deletion both send mail, and both
      # shipped without these two ever being added here, so on every deployed stack the
      # reset endpoint answered 200 with "check your email" while the send threw
      # MissingResendEnvError in the background. Found on preview on 2026-08-19 by asking
      # for a reset and then reading the container log.
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      # Both default to `.data/` under the working directory, which in this image is `/app` and
      # is not writable under `USER canonry`: an import upload answered 500 with EACCES on
      # /app/.data, so imports could not run in production at all. They also have to persist,
      # since `import_job.artefact_path` is read again on a later request and a generated image
      # is a paid artefact that must survive a release.
      IMPORT_ROOT: /data/imports
      MEDIA_ROOT: /data/media
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:5196/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    # Matches the client `packages/vector` pins and the dev and CI servers (issue #182). The
    # jump from v1.12.4 skips the storage compatibility Qdrant guarantees one minor at a time,
    # and v1.17.0 dropped RocksDB, so a volume holding collections written by v1.12.4 panics on
    # boot with an unknown `on_disk` variant in segment.json and has to be walked one minor at
    # a time instead (issue #219, done on the dev volume). Both deployed volumes were empty of
    # collections when this landed, 24 KB of `raft_state.json` and empty directories, so this
    # one is a direct jump, rehearsed first by restoring preview's own volume from a tar into a
    # scratch volume and booting v1.19.0 on it. A future stateful bump does not get to assume
    # that: check for collections first.
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${QDRANT_PORT:-6333}:6333'
    volumes:
      - qdrantdata:/qdrant/storage
    # Docker's default soft limit of 1024 open files is not enough for RocksDB once a deployment
    # has more than a couple of collections, and one collection per universe per embedding model
    # (SPEC.md §11.3) means that arrives with the second customer. It fails as an HTTP 500 with
    # "Too many open files", which reads like a Qdrant bug rather than a limit, so it is worth
    # setting before it is needed. Found in dev, where it broke four unrelated test suites.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3'
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  qdrantdata:
  # Uploaded import artefacts and generated media. Named rather than bound to the release
  # directory on purpose: a release is immutable and gets replaced, and neither of these is
  # rebuildable from the repository.
  appdata:
