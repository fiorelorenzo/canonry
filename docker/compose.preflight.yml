# Postgres and Qdrant for `preflight`'s local checks that need real services: the unit test
# suite and the docker image boot check (scripts/ci-image-boot.sh). Not compose.dev.yml: that
# one binds 55432/56333 and is meant to stay up between runs as a database `pnpm dev` talks
# to, while a preflight run wants a throwaway instance it brings up and tears down around one
# check. Different ports again (15432/16333) so a preflight run never fights a dev stack that
# happens to be up at the same time. Both checks that use this file are marked `serial` in
# .github/preflight.json, so they never contend with each other for these ports either.
name: canonry-preflight

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: canonry
      POSTGRES_PASSWORD: canonry
      POSTGRES_DB: canonry
    ports:
      - '127.0.0.1:15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U canonry -d canonry']
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - '127.0.0.1:16333:6333'
    # See compose.dev.yml: RocksDB keeps a handle per segment file and Docker's default soft
    # limit of 1024 is not enough once a test creates a handful of collections.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
