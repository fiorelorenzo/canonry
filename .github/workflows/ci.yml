# The deploy workflow (issue #94) refuses to release a tag whose CI run here
# did not complete successfully, so job names are written for a human
# scanning the Actions tab rather than for brevity.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per commit per event, and it is insurance rather than a fix, because the
# thing it guards against is not in this file (issue #712). On 2026-08-24 the push
# of e157a12 produced two `push` runs of this workflow twelve seconds apart, both
# running the whole suite, and the earlier one going green while the later one was
# still in progress is what made the preview deploy's CI gate refuse a commit that
# had already passed. There is nothing here that can fire twice for one push: the
# only trigger that matches is `push: branches: [main]`, there is no `paths`
# filter, a filter can match an event once anyway, and the branch deletion that
# `delete_branch_on_merge` performs arrives as a push whose after-sha is all
# zeroes and cannot produce a run for a commit at all. GitHub's own record agrees:
# the repository saw exactly one push event for that transition (one `PushEvent`,
# one check suite each for the four other apps installed here) and two
# `github-actions` check suites for it, 15:57:59Z and 15:58:11Z, with identical
# `before` and `after`. It is the only sha out of 305 that has ever had two, so it
# is a duplicated internal delivery and not a shape of ours to correct.
#
# `cancel-in-progress` is deliberate and it is what stops the doubled bill: a
# duplicate cancels the twelve seconds the first run got through rather than
# queueing behind eight more minutes of it. It leaves a `cancelled` run next to
# the green one for that sha, which is why scripts/deploy/verify-ci.sh treats a
# cancelled run as evidence of nothing.
#
# The group key moved from the commit sha to `github.ref` (2026-09-06) to match the
# estate-wide CI shape: every repo now keys concurrency on event+ref rather than
# event+sha. The duplicate-delivery case above still cancels correctly, since both
# deliveries of the same push share the same ref too. What is new is that a later
# push to main now also cancels an earlier one still running -- deliberately:
# deploy.yml already treats an in-flight preview deploy the same way (issue #222,
# "only the last one matters"), and a cancelled run is exactly the "evidence of
# nothing" verify-ci.sh already handles, so a commit superseded before its own CI
# finished just never gets its own preview deploy, and the next green commit's does.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Node version pinned here must track .node-version; pnpm/setup has no
# node-version-file input.
env:
  NODE_VERSION: 22.22.3

# Three tiers (see AGENTS.md): `preflight` runs the expensive stuff locally before a push
# ever happens; a pull_request gets one cheap gate scoped to whatever `changes` below says
# actually moved; push: main gets the full suite unconditionally, because that is the deploy
# gate and path filters do not apply to it. `ci` at the bottom is the one required status
# check -- everything above it can be renamed or resharded without touching branch
# protection again.
jobs:
  # PR-only. `dorny/paths-filter` answers from the API on a pull_request, so this job needs
  # no checkout and costs a few seconds. Not used on push: main always runs everything below
  # regardless of these outputs, which also spares us the fetch-depth: 0 a push comparison
  # would need.
  #
  # `code` is the gate's only guard now (2026-09-07, issue: post-restructure audit). It used
  # to be four hand-picked filters (`app`, `db`, `vector`, `import`) plus `deps`, one per
  # package that had ever needed the gate -- which meant the other eight packages under
  # packages/* (ai, bench, copilot, eval, indexing, lang, media, warm) matched no filter at
  # all, so a PR touching only packages/lang/** skipped the gate outright and `ci` went green
  # having verified nothing. `code` covers the whole surface the gate can ever need to run
  # for -- apps/**, packages/**, scripts/**, and the root config files that used to live under
  # `deps` -- once, so a new package under packages/* is in scope the day it is added instead
  # of the day someone remembers to add a filter for it. Which package(s) actually get linted
  # and tested is decided inside the gate job itself, by pnpm's own dependency graph, not by
  # this list.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level block above rather than merging with
    # it, so contents: read has to be repeated here. dorny/paths-filter has no checkout on a
    # pull_request (it lists the PR's changed files from the API instead), and that call
    # needs pull-requests: read or it fails "Resource not accessible by integration" on every
    # real PR -- found the hard way across the estate's first rollout of this skeleton.
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      onestore: ${{ steps.filter.outputs.onestore }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'tsconfig.base.json'
              - '.node-version'
              - '.npmrc'
            onestore:
              - 'packages/import/onestore/**'
            scripts:
              - 'scripts/**'
              - 'docker/deploy/compose.deploy.yml'
              - '.env.example'

  # Tier 2: the one cheap gate a PR waits on. `code` above only decides whether the gate runs
  # at all; which packages it actually lints/typechecks/tests is decided in this job by pnpm's
  # own `--filter "...[base]"` -- "everything changed since base, plus everything that depends
  # on it" -- read straight from git history instead of a second, hand-maintained copy of the
  # `changes` path lists that could (and did) drift out of sync with the workspace. The old
  # per-package filters here only ever ran the changed package's own lint/check/test, so a
  # type change in packages/db that broke apps/web's build passed the PR and broke main; the
  # `...` prefix is what pulls web (and everything else standing on packages/db) into the same
  # run. On any event other than `pull_request` there is no scoping at all -- that is the
  # tier-3 full suite.
  #
  # Lint and format caused 16 of ~41 real CI failures in this workflow's history, so lint
  # runs before typecheck and typecheck before the unit tests: a formatter fixes in seconds
  # what a rerun costs in minutes, and there is no reason to boot Postgres and Qdrant for a
  # package that fails prettier.
  gate:
    name: Lint, typecheck, unit tests
    needs: changes
    # `!cancelled() &&` is load-bearing. A job that needs a skipped job is skipped too,
    # whatever its own condition says, unless the condition contains a status-check
    # function. `changes` is PR-only, so it is skipped on every push, so without this
    # the whole suite skipped on main and `ci` went green anyway, because skipped counts
    # as passing. That is the tier meant to catch what the PR path no longer runs.
    # `!cancelled()` rather than `always()`: both defeat the cascade, but `always()`
    # keeps jobs running after a cancellation and wastes the runner slot.
    if: >-
      ${{ !cancelled() && (
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Real Postgres so packages/db's tests exercise real queries and migrations instead of
      # a mock. This is a job-level service, not a step, so it starts (and costs its usual
      # few seconds) whether or not this run's scope actually touches @canonry/db -- cheaper
      # than a second job carrying its own checkout and install just to skip it.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonry
          POSTGRES_PASSWORD: canonry
          POSTGRES_DB: canonry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Qdrant, for the same reason: packages/vector's tests put two universes'
      # identical vectors in one collection and prove the universe filter keeps them apart,
      # which a mock cannot demonstrate. The image has no shell and no curl, so readiness is
      # left to the client's own retry rather than a healthcheck that cannot run.
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      # `fetch-depth: 0` only on the PR path: pnpm's `...[ref]` answers "what changed since
      # this ref" from git history, and a shallow clone gives it nothing to diff against, so
      # it silently matches zero projects and every step below goes green having tested
      # nothing. Push already runs unscoped (see `full` below), so it keeps the default
      # shallow checkout.
      #
      # `fromJSON(cond && '0' || '1')`, not `cond && 0 || 1`: GitHub Actions expressions
      # treat the number `0` as falsy, so `cond && 0 || 1` discards the `0` through `||`
      # and evaluates to `1` even when `cond` is true -- caught by reading this step's own
      # run log, where fetch-depth showed as 1 on a pull_request event. The string `'0'` is
      # truthy (non-empty), so the short-circuit works, and `fromJSON` converts the chosen
      # string back to the number `actions/checkout` expects.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ fromJSON(github.event_name == 'pull_request' && '0' || '1') }}

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `fetch-depth: 0` above gives full history for this PR's own ref, not necessarily a
      # local `origin/<base>` -- so the base branch is fetched by name, never with `--depth`,
      # or pnpm has no commit to diff against and matches nothing.
      #
      # `--filter "...[origin/$base]"` is pnpm's own change detection: everything changed
      # since the base ref, plus everything in the workspace that depends on it, so a type
      # change in packages/db pulls apps/web into the same run without this file having to
      # know that. The workspace root (`canonry`) is itself a pnpm project with no package
      # directory of its own, so pnpm attributes any changed file outside apps/* and
      # packages/* to it; `--changed-files-ignore-pattern` is what keeps a
      # .github/workflows or docs-only diff from being attributed to root and selecting
      # everything. A lockfile or root package.json change is deliberately not in that
      # ignore list: it still gets attributed to root, and root's own lint/check/test/build
      # scripts are `pnpm -r --sequential ...`, so selecting root still means a full run --
      # which is correct, since a dependency bump can break a package that touched no source.
      - name: Scope this run to what changed
        id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.base_ref }}"
          git fetch --no-tags origin "$base:refs/remotes/origin/$base"
          filter="--filter \"...[origin/$base]\" --changed-files-ignore-pattern=\"{.github/**,docs/**,**/*.md}\""
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          echo "full=false" >> "$GITHUB_OUTPUT"
          echo "scoped to:$filter"

      # Cheap and purely diagnostic: proves in the run log which projects `...[base]` picked
      # up, which is the only way to see a dependent (e.g. web, pulled in by a packages/db
      # change) getting swept into a run that only touched one package's own directory.
      - name: Show what this run selected
        if: steps.scope.outputs.full == 'false'
        run: pnpm ${{ steps.scope.outputs.filter }} list --depth -1

      # `src/playbooks.generated.ts` is committed so that every build path has it, including
      # the Docker image (which builds apps/web directly and never runs this package's own
      # build) and a bare `pnpm dev`. Committed codegen can go stale, so this is the guard:
      # regenerate and fail if anything moved. The alternative, generating it everywhere, is
      # how production ended up shipping without the playbooks at all.
      #
      # Full-suite only: a PR that never touched packages/import cannot have made this
      # stale, and `preflight` runs the same check locally whenever it does.
      - name: Generated playbooks are current
        if: steps.scope.outputs.full == 'true'
        run: |
          pnpm --filter @canonry/import playbooks
          git diff --exit-code -- packages/import/src/playbooks.generated.ts

      - name: Lint
        run: pnpm ${{ steps.scope.outputs.filter }} lint

      - name: Typecheck
        run: pnpm ${{ steps.scope.outputs.filter }} check

      # `--sequential`: every package under packages/* that touches Postgres reads
      # `TEST_DATABASE_URL` before its own per-run `TEST_DB_SUFFIX`-suffixed default (see
      # e.g. packages/db/src/index.ts and its siblings), and this step sets one literal
      # `TEST_DATABASE_URL` for the whole job, on purpose: apps/web's own tests key off that
      # same variable and isolate by inserting uniquely-slugged rows rather than owning a
      # whole database. That single shared name is safe with one db-touching package at a
      # time, which is all the old hand-mapped filters ever selected together, but the
      # native `...[base]` filter can now select several in the same run (a packages/db
      # change alone pulls in eight others), and running their suites in parallel means two
      # of them race to create or drop that same database -- caught the hard way with
      # `PostgresError: duplicate key value violates unique constraint
      # "pg_database_datname_index"` the first time a diff touched two db-backed packages at
      # once. `--sequential` is exactly what root's own `test` script already does
      # (`pnpm -r --sequential test`) for the unscoped full run on push, so this only makes
      # the PR path match a safety property push already had.
      - name: Unit tests
        run: pnpm ${{ steps.scope.outputs.filter }} --sequential test
        env:
          TEST_DATABASE_URL: postgres://canonry:canonry@localhost:5432/canonry_test
          QDRANT_URL: http://localhost:6333

      # Full-suite only, same reasoning as the playbooks check above: `docker-boot` below
      # already proves apps/web and @canonry/db build, since building them is what the
      # Docker image does. The only thing this step catches beyond that is one of the other
      # nine packages failing to build, which `preflight`'s own `build` check gives a
      # developer before the push happens.
      - name: Build
        if: steps.scope.outputs.full == 'true'
        run: pnpm build

  # Tier 3, main-only (2026-09-06): this job used to run on every PR too, at 2.4 of the old
  # job's 6.2-minute median, for a check a PR-scoped gate cannot meaningfully shrink -- it
  # proves the whole image, not one package. `preflight`'s own `docker-boot` check gives a
  # developer the same answer before the push happens; this is the same script
  # (scripts/ci-image-boot.sh) run against the service container below instead of a
  # docker-compose one, so the two can never quietly diverge.
  docker-boot:
    name: Build image and verify served health
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonry
          POSTGRES_PASSWORD: canonry
          POSTGRES_DB: canonry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build, boot and sweep the image
        run: scripts/ci-image-boot.sh

  # The committed wasm reader still matches its source (issue #603).
  #
  # `packages/import/src/onestore-wasm.generated.ts` is the OneNote [MS-ONESTORE] parser
  # built for wasm32-unknown-unknown, brotli-compressed and base64-encoded, and it is
  # committed for the same reason `src/playbooks.generated.ts` is: the Docker image builds
  # apps/web directly and its runtime stage carries only Vite's output, into which a
  # source-exported workspace package is inlined, so a loose `.wasm` file would reach
  # neither the image nor a `pnpm dev`. Committed codegen goes stale, so this regenerates
  # it and fails on a diff, exactly as the `gate` job does for the playbooks.
  #
  # This is the only job that needs a Rust toolchain, and that is the whole point: Rust is
  # a verification dependency here and never a build dependency, so `pnpm build`, the
  # Docker image and a fresh clone all work without it. Independent of `gate` so it never
  # blocks the main pipeline, and deliberately **not** a required status check: a required
  # check that installs a second toolchain is a slow gate on every unrelated PR. Scoped to
  # `packages/import/onestore/**` on a PR (2026-09-06): every other event runs it
  # unconditionally, same as every other tier-3 job.
  #
  # Reproducibility is what makes the diff meaningful. `rust-toolchain.toml` pins the
  # compiler, `Cargo.lock` pins the tree, and `build.sh` passes `--remap-path-prefix` for
  # the registry and crate paths rustc would otherwise bake into panic messages. Two clean
  # builds agree byte for byte; without the remap they would differ by the building user's
  # home directory.
  wasm:
    name: Committed wasm reader matches its source
    needs: changes
    # See the gate job's comment for why `!cancelled()` is not optional here.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.onestore == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No toolchain action: `rust-toolchain.toml` in the crate directory is what selects
      # the compiler and the target, and rustup honours it on the first cargo invocation.
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/import/onestore/target
          key: onestore-${{ runner.os }}-${{ hashFiles('packages/import/onestore/Cargo.lock', 'packages/import/onestore/rust-toolchain.toml') }}

      - name: Rebuild the artefact
        run: packages/import/onestore/build.sh

      - name: It is identical to the committed one
        run: git diff --exit-code -- packages/import/src/onestore-wasm.generated.ts

  # No node toolchain needed here: scripts/deploy/*.sh and the top-level scripts/*.sh
  # are plain bash with no pnpm package of their own, so `pnpm lint` never reaches
  # them and this is the only place that does. Independent of the `gate` job on
  # purpose, so a shell issue here never blocks or waits on the node/postgres/qdrant
  # setup above. Cheap enough (0.2m median) and load-bearing enough for the deploy
  # gate that it stays on the PR path too, scoped (2026-09-06) to scripts/** plus the
  # compose/env files test-deploy-env.sh reads; every other event runs it
  # unconditionally.
  deploy-scripts:
    name: Shellcheck and test the shell scripts
    needs: changes
    # See the gate job's comment for why `!cancelled()` is not optional here.
    if: >-
      ${{ !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.scripts == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shellcheck scripts/deploy
        run: |
          cd scripts/deploy
          bash -n *.sh
          shellcheck -x *.sh

      # Issue #266: the test-db janitor lives at the top level of scripts/, not under
      # scripts/deploy, because it is not a deploy script. Checked separately, and not
      # folded into the glob above, so a future non-bash file at the top of scripts/
      # (there is already build-demo-corpus.mjs) never breaks this step by accident.
      # ci-image-boot.sh joined this list on 2026-09-06, when it was extracted out of the
      # docker-boot job below so `preflight` can run the exact same script.
      - name: Shellcheck top-level scripts
        run: |
          cd scripts
          bash -n demo-reset.sh test-db-janitor.sh ci-image-boot.sh
          shellcheck -x demo-reset.sh test-db-janitor.sh ci-image-boot.sh

      # Issue #228: the supersede gate that keeps a superseded CI run from
      # deploying backwards. Builds its own throwaway git repo and stack
      # directory and stubs docker/curl, so it needs no self-hosted runner
      # and no real stack, unlike the deploy job itself.
      - name: Run the deploy script tests
        run: scripts/deploy/test-release-supersede.sh

      # Issue #712: the CI gate the deploy workflow calls, whose verdict used to
      # depend on which run for a commit happened to be newest at the moment it was
      # asked. Drives verify-ci.sh through its --stdin path against recorded
      # `gh api .../runs` responses, so it needs no network and no token; the gh
      # call itself, and therefore the deploy job, is still only exercised for real
      # on a deploy.
      - name: The deploy's CI gate gives the same verdict whenever it is asked
        run: scripts/deploy/test-verify-ci.sh

      # Every credential .env.example documents has to reach the deployed web container.
      # #247's password reset and #250's account deletion both shipped unable to send a
      # single mail on any stack, because compose.deploy.yml enumerates the web service's
      # environment and nobody added RESEND_API_KEY or MAIL_FROM to that list. Nothing in
      # CI could see it: the unit tests inject their own environment, and the docker-boot
      # job checks that surfaces render rather than that a background job can do its work.
      # Compares two lists of names, so it needs no docker, no secrets and no network.
      - name: Check the deployed environment carries what .env.example promises
        run: scripts/deploy/test-deploy-env.sh

  # The single required status check. Never rename it: it is the one context in the
  # protect-default-branch ruleset, so every job name above it can change forever without
  # touching a ruleset again. `skipped` counts as passing -- that is the whole point: a PR
  # that only touched, say, docs/ skips every job above and `ci` still goes green, because
  # nothing here could have broken and `preflight` is what verified the actual change
  # before it was ever pushed.
  ci:
    name: ci
    if: always()
    needs: [changes, gate, docker-boot, wasm, deploy-scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
