# The deploy workflow (issue #94) refuses to release a tag whose CI run here
# did not complete successfully, so job names are written for a human
# scanning the Actions tab rather than for brevity.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Node version pinned here must track .node-version; pnpm/setup has no
# node-version-file input.
env:
  NODE_VERSION: 22.22.3

jobs:
  test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      # Real Postgres so packages/db's tests exercise real queries and
      # migrations instead of a mock.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonry
          POSTGRES_PASSWORD: canonry
          POSTGRES_DB: canonry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real Qdrant, for the same reason: packages/vector's tests put two universes'
      # identical vectors in one collection and prove the universe filter keeps them apart,
      # which a mock cannot demonstrate. The image has no shell and no curl, so readiness is
      # left to the client's own retry rather than a healthcheck that cannot run.
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated playbooks are current
        # `src/playbooks.generated.ts` is committed so that every build path has it, including the
        # Docker image (which builds apps/web directly and never runs this package's own build) and
        # a bare `pnpm dev`. Committed codegen can go stale, so this is the guard: regenerate and
        # fail if anything moved. The alternative, generating it everywhere, is how production
        # ended up shipping without the playbooks at all.
        run: |
          pnpm --filter @canonry/import playbooks
          git diff --exit-code -- packages/import/src/playbooks.generated.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://canonry:canonry@localhost:5432/canonry_test
          QDRANT_URL: http://localhost:6333

      - name: Build
        run: pnpm build

  docker-boot:
    name: Build image and verify served health
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canonry
          POSTGRES_PASSWORD: canonry
          POSTGRES_DB: canonry
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canonry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute build identifiers
        id: version
        run: |
          echo "version=0.0.0-ci.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # The image boots a canon-save worker (issue #115), which queries `canon_save_job` on
      # its first poll, so this check needs a migrated database rather than an empty one. That
      # is also what a real deployment does: migrations run explicitly, before the new release
      # serves traffic, never implicitly from inside the app.
      #
      # Applied with psql rather than `pnpm --filter @canonry/db migrate` because this job has
      # no node toolchain and does not need one: what the boot check wants is the schema, and
      # drizzle's own runner is already exercised by every integration test in the job above.
      # ON_ERROR_STOP is what makes a broken migration fail here instead of surfacing as a
      # confusing 500 from the container three steps later.
      - name: Apply migrations to the boot-check database
        run: |
          for f in $(ls packages/db/migrations/*.sql | sort); do
            echo "applying $f"
            docker run --rm --network host -v "$PWD:/repo" -e PGPASSWORD=canonry postgres:16 \
              psql -h 127.0.0.1 -U canonry -d canonry -v ON_ERROR_STOP=1 -q -f "/repo/$f"
          done

      - name: Build runtime image
        run: |
          docker build -f docker/Dockerfile \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg APP_COMMIT=${{ steps.version.outputs.commit }} \
            -t canonry-web:ci .

      # --network host: the simplest way for the freshly built container to
      # reach the postgres service container, which GitHub-hosted runners
      # publish to the runner's own loopback interface, not a shared docker
      # network. QDRANT_URL is left pointing nowhere on purpose: /healthz must
      # degrade rather than fail when only Qdrant is unreachable.
      # BETTER_AUTH_SECRET is required because the app refuses to boot without one rather
      # than falling back to Better Auth's insecure default (issue #86). The value here is
      # throwaway and signs nothing that outlives this job: the point of this step is that
      # the image starts and serves the version it was built with, not that anybody can sign
      # in. ORIGIN matters for the same reason it matters in production: adapter-node only
      # ever sees plain HTTP from a proxy, so a missing ORIGIN answers 403 to every form POST
      # while the build stays green.
      - name: Boot the image against Postgres
        run: |
          docker run -d --name canonry-web-ci \
            --network host \
            -e DATABASE_URL=postgres://canonry:canonry@127.0.0.1:5432/canonry \
            -e QDRANT_URL=http://127.0.0.1:1 \
            -e ORIGIN=http://127.0.0.1:5196 \
            -e BETTER_AUTH_SECRET=ci-boot-check-secret-not-used-for-anything \
            canonry-web:ci

      # SPEC.md #12: a green curl has served a stale build on this box
      # before. Comparing the served version against the version this exact
      # build was tagged with is the check that catches that.
      - name: Wait for /healthz and verify the served version
        run: |
          body=""
          for _ in $(seq 1 30); do
            if body=$(curl -sf http://127.0.0.1:5196/healthz); then
              break
            fi
            sleep 1
          done
          if [ -z "$body" ]; then
            echo "::error::web container never answered /healthz"
            exit 1
          fi
          echo "$body" | jq .

          served_version=$(echo "$body" | jq -r '.version')
          served_db=$(echo "$body" | jq -r '.db')

          if [ "$served_version" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::served version '$served_version' does not match the built artifact '${{ steps.version.outputs.version }}' -- stale image"
            exit 1
          fi
          if [ "$served_db" != "true" ]; then
            echo "::error::/healthz reports db=false while booted against a healthy Postgres"
            exit 1
          fi

      # /healthz alone proves the process booted, not that the app can render anything: it
      # touches no route module, so a page whose server module crashes on import stays
      # invisible. That is not hypothetical. `pdfjs-dist` loads browser globals at module
      # top level, so every route that transitively imported the import engine answered 500
      # in production while this job stayed green. One request per surface closes that hole
      # for a couple of seconds of CI.
      - name: Every real surface renders, none of them 500
        run: |
          fail=0
          for path in / /auth/sign-in /auth/sign-up /privacy /docs /docs/import /u/new /u/valdoria-reach; do
            code=$(curl -s -o /tmp/body.html -w '%{http_code}' "http://127.0.0.1:5196$path")
            printf '%-26s %s\n' "$path" "$code"
            # 2xx, a redirect to sign-in, or an honest 404 for a universe this empty
            # database does not have are all fine. A 5xx never is.
            case "$code" in
              5*) echo "::error::$path answered $code"; head -c 400 /tmp/body.html; fail=1 ;;
            esac
          done
          [ "$fail" -eq 0 ]

      - name: No unhandled exception reached the log
        run: |
          # A route can answer 500 from a caught error, and it can also log an uncaught
          # rejection while answering 200 from a fallback. Both matter, so the log is
          # checked separately from the status codes above.
          if docker logs canonry-web-ci 2>&1 | grep -nE 'ReferenceError|TypeError: Cannot|UnhandledPromiseRejection|Cannot find module'; then
            echo "::error::the container logged an unhandled error while serving those routes"
            exit 1
          fi
      - name: Container logs
        if: always()
        run: docker logs canonry-web-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f canonry-web-ci || true
