# Two triggers, two stacks (issues #94, #95; SPEC.md #12), following the loombox
# pattern already running on prodbox: build once on a GitHub-hosted runner,
# deploy on the self-hosted runner that lives on prodbox itself, gate on the
# served version actually matching what was built, and keep releases
# immutable so a rollback is a symlink flip plus a container recreate.
#
#   main, once CI is green  ->  preview
#   a vX.Y.Z tag            ->  prod
#
# `preview` hangs off `workflow_run` rather than off `push: branches: [main]` on
# purpose. The gate below refuses a commit whose CI run is not a *completed*
# success, and a push trigger races CI rather than following it, so every preview
# deploy would have failed on a run that was still in progress. Waiting for CI
# from inside this workflow would mean polling and paying for the wait; letting
# CI's own completion be the trigger costs nothing and cannot race.
#
# Job names are written for a human scanning the Actions tab, same reasoning
# as ci.yml.
name: Deploy

on:
  push:
    tags: ['v*.*.*']
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Target stack
        type: choice
        options: [prod, preview]
        default: prod
      ref:
        description: Tag or sha to deploy (defaults to the ref this run was triggered on)
        required: false

# One deploy at a time per stack, because a release is a symlink flip plus a container
# recreate on a real box and two overlapping runs against the same stack is the one thing
# that can leave it half moved.
#
# Whether the queue cancels depends on which stack, and the two want opposite things
# (issue #222). `preview` fires on every green CI run on `main`, so a wave of merges queues
# one deploy per commit of which only the last one matters: nine runs that exist to be
# superseded, and enough traffic from this box that the runner started failing to download
# its own actions with a 429. Superseding them is the correct behaviour there. A `prod` tag
# or a manual dispatch is a deliberate release, so it is never cancelled by a later one.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_run' && 'preview' || (inputs.stack || 'prod') }}
  cancel-in-progress: ${{ github.event_name == 'workflow_run' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/canonry-web

jobs:
  # Refuses to go any further unless the exact commit being deployed has a
  # completed, successful run of ci.yml, and decides which stack this run is for.
  # The check is not redundant with ci.yml's own branch-protection role: a tag can
  # be pushed at any commit, including one CI never saw. On the `workflow_run`
  # path the trigger already is a finished CI run, and the check still runs
  # because it costs one API call and it is what makes the two paths identical.
  verify-ci:
    name: Resolve the target stack and refuse a commit without a green CI run
    # A failed or cancelled CI run also completes, and `workflow_run` fires on any
    # completion, so this is the one guard that keeps a red main off preview.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      stack: ${{ steps.resolve.outputs.stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `github.ref` on a workflow_run is the default branch, not the commit CI
          # actually ran on, so that path names its own head sha explicitly.
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the stack, the commit and the version string
        id: resolve
        run: |
          if [ -n "${{ inputs.stack }}" ]; then
            stack="${{ inputs.stack }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            stack=preview
          else
            stack=prod
          fi

          ref="${{ inputs.ref || github.event.workflow_run.head_sha || github.ref_name }}"
          sha=$(git rev-parse "${ref}^{commit}")

          # A tag is its own version. Anything else is a commit on main, and what a
          # human wants to read on preview's /healthz is how far past the last
          # release it is, so `git describe` rather than a bare sha.
          case "$ref" in
          v*.*.*) version="$ref" ;;
          *) version=$(git describe --tags --always "$sha") ;;
          esac

          {
            echo "stack=$stack"
            echo "sha=$sha"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "deploying $version ($sha) to $stack"

      - name: Verify CI is a completed success for that commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/deploy/verify-ci.sh \
            --repo "${{ github.repository }}" \
            --sha "${{ steps.resolve.outputs.sha }}" \
            --workflow ci.yml

  # Builds the runtime image once and pushes it to GHCR tagged with both the
  # release version and the commit sha. The self-hosted deploy job below
  # pulls this exact image by digest -- it never rebuilds on prodbox.
  build:
    name: Build and push the runtime image
    runs-on: ubuntu-latest
    needs: verify-ci
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ needs.verify-ci.outputs.version }}
            APP_COMMIT=${{ needs.verify-ci.outputs.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify-ci.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.verify-ci.outputs.sha }}

      - name: Pin the deploy reference to this build's digest
        id: image
        run: echo "ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Runs on prodbox itself. releases/<sha> is written once and never
  # touched again; the health gate compares what /healthz actually serves
  # against this exact build, and a failed gate rolls back automatically.
  deploy:
    name: Deploy to prodbox and gate on the served version
    runs-on: [self-hosted, prodbox]
    needs: [verify-ci, build]
    # Every stack decision comes from verify-ci's `resolve` step, so there is one
    # place that answers "which stack is this run for" rather than the same
    # `inputs.stack || 'prod'` expression repeated in four places and one of them
    # wrong the first time somebody adds a trigger.
    environment: ${{ needs.verify-ci.outputs.stack == 'preview' && 'preview' || 'production' }}
    steps:
      # Deliberately not actions/checkout (issue #222). This job runs on prodbox, where the
      # runner downloads a marketplace action unauthenticated from codeload.github.com on
      # every single run, from an IP that also serves loombox's runner: three deploys in a
      # row died in `Set up job` with a 429 before reaching a line of deploy code. All this
      # step actually needs is `scripts/deploy/` and `docker/deploy/` at the deployed sha,
      # which git fetches directly, and canonry is public so it needs no credential to do
      # it. `--force` plus `clean` because the workspace survives between runs.
      - name: Check out the deploy scripts at this commit
        run: |
          git init -q .
          git remote get-url origin >/dev/null 2>&1 \
            || git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          git remote set-url origin "${{ github.server_url }}/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ needs.verify-ci.outputs.sha }}"
          git checkout -q --force FETCH_HEAD
          git clean -qfd
          test -x scripts/deploy/release.sh
          test -f docker/deploy/compose.deploy.yml
          echo "checked out $(git rev-parse HEAD)"

      - name: Release
        run: |
          stack="${{ needs.verify-ci.outputs.stack }}"
          if [ "$stack" = "preview" ]; then port=5296; else port=5196; fi
          base="${{ vars.DEPLOY_BASE_DIR || '/opt/canonry' }}/$stack"

          scripts/deploy/release.sh \
            --stack "$stack" \
            --base "$base" \
            --sha "${{ needs.verify-ci.outputs.sha }}" \
            --version "${{ needs.verify-ci.outputs.version }}" \
            --image "${{ needs.build.outputs.image }}" \
            --port "$port" \
            --deployed-by "github-actions ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Summary
        if: always()
        run: |
          stack="${{ needs.verify-ci.outputs.stack }}"
          base="${{ vars.DEPLOY_BASE_DIR || '/opt/canonry' }}/$stack"
          {
            echo "### Deploy to $stack"
            echo
            if [ -f "$base/DEPLOYED.json" ]; then
              echo '```json'
              cat "$base/DEPLOYED.json"
              echo '```'
            else
              echo "no $base/DEPLOYED.json found"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
