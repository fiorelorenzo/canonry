<!doctype html>
<html lang="en" data-theme-pref>
	<head>
		<!-- The `lang` and `data-theme` attributes above start at their static defaults
				(English, no theme forced) because svelte-kit sync/prerendering runs with no
				request behind it. hooks.server.ts's `handle` rewrites both per request -
				`data-theme-pref` to the resolved theme (G1) and the English default to the
				resolved interface locale (issue #120, SPEC.md §17) - via `transformPageChunk`,
				a plain string replace on the literal attributes above. This comment
				deliberately sits *after* both, never before: `replace` only touches the first
				match in a chunk, and prose describing the mechanism must not itself become
				that match. -->
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />

		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<!-- The alternate is the PNG rather than the ICO on purpose: adapter-node's mime table has
				no entry for .ico, so it serves with an empty content-type, which browsers sniff but
				crawlers and link unfurlers need not. The .ico file still ships at the root, because
				browsers ask for /favicon.ico by themselves without reading any of this. -->
		<link rel="alternate icon" type="image/png" href="%sveltekit.assets%/favicon-32.png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta
			name="theme-color"
			data-theme-color="light"
			media="(prefers-color-scheme: light)"
			content="#f4efe4"
		/>
		<meta
			name="theme-color"
			data-theme-color="dark"
			media="(prefers-color-scheme: dark)"
			content="#17140f"
		/>
		<!-- The pair above is the OS-preference answer, which is right for "Match system" and
				is also all this file can say with no request behind the render. hooks.server.ts
				rewrites each one's `media` for an explicit Light or Dark, through
				$lib/theme's applyThemePreference (issue #740): a <meta> cannot read
				[data-theme], so left alone the browser chrome contradicts a palette the GM
				chose in Settings. Same rule as the comment at the top of this head about where
				prose may sit: this one is after the metas it describes, and deliberately does
				not quote the attribute being replaced.

				`data-theme-color` is how the same rewrite finds these two again on a live
				document when the setting changes without a reload (issue #752). It cannot go
				by the media query, because the query is the thing being rewritten and would
				only be findable the first time. -->

		<!-- V10 (#496): preload the reading room's own face. Roman only, not the italic
				variant - italic is real but rarer per page, and a second preloaded font
				competes with the first for the same early bandwidth. `crossorigin` is
				required even though the file is same-origin: fonts are always fetched in
				anonymous CORS mode, and a preload whose crossorigin attribute does not match
				the actual request's mode is discarded as a wasted fetch rather than reused. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/literata-variable.woff2"
			crossorigin="anonymous"
		/>

		<!-- Issue #286: the three controls decision O4 = B ships are popovers and a radio
				group, and a popover cannot be opened without JavaScript. A call site that has
				to keep working without it marks its enhanced control `data-js-only` and renders
				`ui/native-fallback` beside it, which puts a real `<select>` inside `<noscript>`.
				This is the other half of that pair: with scripting off, the control that cannot
				work is not shown. It lives here rather than in the component because it has to
				apply before the first paint, and because one declaration is enough for every
				instance on the page. -->
		<noscript>
			<style>
				[data-js-only] {
					display: none !important;
				}
			</style>
		</noscript>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
